<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="jamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="140" fill="#0A0B12" />
  
  <!-- Ambient Inner Glow -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#glow)" />
  
  <!-- Subtle Glowing Border -->
  <rect x="12" y="12" width="488" height="488" rx="128" stroke="url(#borderGrad)" stroke-width="12" stroke-opacity="0.75" />

  <!-- Radio Broadcast Waves -->
  <!-- Outer arcs (r = 175) -->
  <path
    d="M 380 132 A 175 175 0 0 1 380 380"
    stroke="url(#jamGrad)"
    stroke-width="36"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M 132 380 A 175 175 0 0 1 132 132"
    stroke="url(#jamGrad)"
    stroke-width="36"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Inner arcs (r = 105) -->
  <path
    d="M 330 182 A 105 105 0 0 1 330 330"
    stroke="url(#jamGrad)"
    stroke-width="36"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M 182 330 A 105 105 0 0 1 182 182"
    stroke="url(#jamGrad)"
    stroke-width="36"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Center Core Beacon -->
  <circle cx="256" cy="256" r="42" fill="url(#jamGrad)" />
  <circle cx="256" cy="256" r="18" fill="#FFFFFF" />
</svg>
